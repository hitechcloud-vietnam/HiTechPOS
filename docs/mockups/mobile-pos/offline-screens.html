<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posnic · Offline POS screen collection</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0e9;color:#183c38;font:15px/1.5 system-ui,sans-serif}header{max-width:1250px;margin:40px auto;padding:0 20px}img{width:115px}h1{font-size:38px;letter-spacing:-1px;margin-bottom:10px}p{color:#657973}a{color:#166c59}.grid{max-width:1300px;margin:30px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:35px;padding:0 20px 50px}.screen{max-width:390px;width:100%;margin:auto}iframe{border:0;width:100%;height:800px}h2{font-size:17px}small{font-weight:400;color:#657973}</style></head><body><header><img src="posnic.svg" alt="Posnic"><h1>A complete counter. Even offline.</h1><p>Proposed mobile and POS settings screens · All data and hardware states are simulated.</p><a href="offline.html">Open interactive cash sale → print → sync journey ↗</a></header><div class="grid" id="grid"></div><script>const names={sell:'Offline counter',payment:'Take payment',receipt:'Saved receipt',printer:'Direct printer',attention:'Printer recovery',sync:'Sync centre',history:'Receipt history',storage:'Offline data',desktop:'Desktop module settings'};document.getElementById('grid').innerHTML=Object.entries(names).map(([key,title],i)=>`<section class="screen"><h2><small>0${i+1} /</small> ${title}</h2><iframe loading="lazy" title="${title}" src="offline.html?embed=1&screen=${key}"></iframe></section>`).join('')</script></body></html>
