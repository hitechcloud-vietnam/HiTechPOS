<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị – HiTechPOS</title>
<style>
  :root { --brand: #1d2733; --accent: #0b6bcb; --ink: #1d2733; --muted: #5d6b7a; --bg: #f5f8fb; --line: #dde5ee; --ok: #12805c; --err: #c0392b; --warn: #a76300; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { margin: 0 0 10px; font-size: 1.05rem; }
  .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .stat b { display: block; font-size: 1.5rem; }
  .muted { color: var(--muted); font-size: .85rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .wrap { overflow-x: auto; }
  input, select, button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: var(--err); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .78rem; background: #eef4fb; white-space: nowrap; }
  .ok { background: #e5f6ef; color: var(--ok); } .warn { background: #fff4e0; color: var(--warn); } .bad { background: #fbeaea; color: var(--err); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  details summary { cursor: pointer; color: var(--accent); }
  code { font-size: .8rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>HiTechPOS · Quản trị hệ thống</strong>
  <form id="keyForm" style="display:flex;gap:6px">
    <input id="adminKey" type="password" placeholder="Admin API key" autocomplete="off">
    <button>Kết nối</button>
  </form>
</header>
<main id="app" hidden>
  <section class="card">
    <h2>Tổng quan</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card">
    <h2>Cửa hàng</h2>
    <div class="toolbar">
      <input id="q" placeholder="Tìm tên miền, tên shop…">
      <select id="filter"><option value="">Tất cả</option><option value="trialing">Dùng thử</option><option value="active">Trả phí</option><option value="suspended">Bị khoá</option><option value="install_failed">Cài lỗi</option></select>
      <button class="ghost" id="expiry">Chạy kiểm tra hết hạn</button>
    </div>
    <div class="wrap"><table><thead><tr><th>Cửa hàng</th><th>Ngành</th><th>Gói</th><th>Hết hạn</th><th>Trạng thái</th><th>Tích hợp</th><th>Onboarding</th><th></th></tr></thead><tbody id="tenants"></tbody></table></div>
  </section>

  <section class="card">
    <h2>Giao dịch cần đối soát</h2>
    <p class="muted">Số tiền nhận khác số tiền yêu cầu. Kiểm tra sao kê trước khi chấp nhận.</p>
    <div class="wrap"><table><thead><tr><th>Thời gian</th><th>Mã đơn</th><th>Loại</th><th>Cổng</th><th>Yêu cầu</th><th>Đã nhận</th><th></th></tr></thead><tbody id="review"></tbody></table></div>
  </section>
</main>
<footer style="text-align:center;padding:16px;color:#5d6b7a;font-size:.85rem">HiTechPOS · AGPL-3.0 · <a href="/source">Mã nguồn</a></footer>
<script>
const $ = (s) => document.querySelector(s);
const vnd = (n) => new Intl.NumberFormat('vi-VN').format(n || 0) + ' ₫';
const dt = (s) => s ? new Date(s).toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' }) : '–';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let key = '';
try { key = sessionStorage.getItem('hitechpos_admin') || ''; } catch {}
let tenants = [];

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-admin-key': key }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => null);
  if (!res.ok) throw new Error((json && json.message) || 'Lỗi ' + res.status);
  return json;
}

$('#keyForm').onsubmit = (e) => {
  e.preventDefault();
  key = $('#adminKey').value.trim();
  try { sessionStorage.setItem('hitechpos_admin', key); } catch {}
  load();
};

function statusPill(t) {
  if (t.status === 'install_failed') return '<span class="pill bad">Cài lỗi</span>';
  if (t.suspended) return `<span class="pill bad">Khoá${t.suspendedReason ? ' · ' + esc(t.suspendedReason) : ''}</span>`;
  if (t.subscription.status === 'trialing') return '<span class="pill warn">Dùng thử</span>';
  return '<span class="pill ok">Hoạt động</span>';
}

function onboardingCell(o) {
  if (!o) return '<span class="muted">–</span>';
  const steps = Object.entries(o).filter(([k]) => !['at', 'preset'].includes(k));
  const failed = steps.filter(([, v]) => String(v).startsWith('failed'));
  return `<details><summary>${failed.length ? `<span class="pill bad">${failed.length} lỗi</span>` : '<span class="pill ok">OK</span>'}</summary>
    ${steps.map(([k, v]) => `<div><code>${esc(k)}</code>: ${esc(v)}</div>`).join('')}</details>`;
}

function renderTenants() {
  const q = $('#q').value.trim().toLowerCase();
  const f = $('#filter').value;
  const rows = tenants.filter((t) => (!q || (t.subdomain + ' ' + t.businessName).toLowerCase().includes(q)) &&
    (!f || (f === 'suspended' ? t.suspended : f === 'install_failed' ? t.status === 'install_failed' : t.subscription.status === f && !t.suspended)));
  $('#tenants').innerHTML = rows.map((t) => `<tr>
    <td><b>${esc(t.businessName)}</b><br><a href="${esc(t.urls[0])}" target="_blank" rel="noopener">${esc(t.subdomain)}</a><br><span class="muted">${esc(t.tenantDb)} · ${dt(t.createdAt)}</span>${t.installError ? `<br><span class="pill bad">${esc(t.installError)}</span>` : ''}</td>
    <td>${esc(t.industry)}</td>
    <td>${esc(t.plan.id)}</td>
    <td>${dt(t.subscription.currentPeriodEnd)}</td>
    <td>${statusPill(t)}</td>
    <td>${t.paymentMethods.map((m) => `<span class="pill">${m}</span>`).join(' ')}${t.bankFeed ? ' <span class="pill">bank-feed</span>' : ''}${t.einvoice ? ` <span class="pill">HĐĐT ${esc(t.einvoice.provider)}${t.einvoice.autoIssue ? ' · tự động' : ''}</span>` : ''}</td>
    <td>${onboardingCell(t.onboarding)}</td>
    <td>${t.suspended ? `<button class="ghost" data-resume="${t.id}">Mở khoá</button>` : `<button class="danger" data-suspend="${t.id}">Khoá</button>`}</td>
  </tr>`).join('') || '<tr><td colspan="8" class="muted">Không có cửa hàng</td></tr>';
  document.querySelectorAll('[data-suspend]').forEach((b) => b.onclick = async () => {
    const reason = prompt('Lý do khoá cửa hàng?', 'manual');
    if (reason === null) return;
    await api('POST', `/api/admin/tenants/${b.dataset.suspend}/suspend`, { reason }); load();
  });
  document.querySelectorAll('[data-resume]').forEach((b) => b.onclick = async () => {
    if (!confirm('Mở khoá cửa hàng này?')) return;
    await api('POST', `/api/admin/tenants/${b.dataset.resume}/resume`); load();
  });
}
$('#q').oninput = renderTenants;
$('#filter').onchange = renderTenants;
$('#expiry').onclick = async () => {
  const r = await api('POST', '/api/admin/jobs/enforce-expiry');
  alert(r.suspended.length ? 'Đã khoá: ' + r.suspended.join(', ') : 'Không có cửa hàng nào hết hạn.');
  load();
};

async function load() {
  try {
    const [stats, list, review] = await Promise.all([api('GET', '/api/admin/stats'), api('GET', '/api/admin/tenants'), api('GET', '/api/admin/payments?status=review')]);
    $('#app').hidden = false;
    $('#stats').innerHTML = [['Cửa hàng', stats.tenants], ['Đang hoạt động', stats.active], ['Dùng thử', stats.trialing], ['Trả phí', stats.paying], ['Bị khoá', stats.suspended], ['Cài lỗi', stats.installFailed], ['MRR', vnd(stats.mrr)]]
      .map(([l, v]) => `<div class="stat"><span class="muted">${l}</span><b>${v}</b></div>`).join('');
    tenants = list;
    renderTenants();
    $('#review').innerHTML = review.map((p) => {
      const received = (p.events || []).filter((e) => e.amount != null).map((e) => e.amount).pop();
      return `<tr><td>${dt(p.createdAt)}</td><td>${p.orderCode}</td><td>${p.purpose === 'subscription' ? 'Thuê bao' : 'Tại quầy'}</td><td>${esc(p.provider)}</td>
        <td>${vnd(p.amount)}</td><td>${vnd(received)}</td><td><button class="ghost" data-accept="${p.orderCode}">Chấp nhận</button></td></tr>`;
    }).join('') || '<tr><td colspan="7" class="muted">Không có giao dịch cần đối soát</td></tr>';
    document.querySelectorAll('[data-accept]').forEach((b) => b.onclick = async () => {
      const note = prompt('Ghi chú đối soát (mã giao dịch ngân hàng…)');
      if (note === null) return;
      await api('POST', `/api/admin/payments/${b.dataset.accept}/accept`, { note }); load();
    });
  } catch (e) {
    alert(e.message);
  }
}
if (key) load();
</script>
</body>
</html>
