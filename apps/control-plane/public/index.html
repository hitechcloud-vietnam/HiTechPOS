<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiTechPOS – Phần mềm bán hàng đa ngành</title>
<style>
  :root { --brand: #0b6bcb; --ink: #1d2733; --muted: #5d6b7a; --bg: #f5f8fb; --card: #fff; --line: #dde5ee; --ok: #12805c; --err: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: 40px 16px; text-align: center; }
  header h1 { margin: 0 0 8px; font-size: 2rem; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h2 { margin-top: 40px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card.hl { border: 2px solid var(--brand); }
  .price { font-size: 1.6rem; font-weight: 700; }
  .muted { color: var(--muted); font-size: .9rem; }
  ul.f { padding-left: 18px; margin: 8px 0 0; }
  .ind { cursor: pointer; }
  .ind.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }
  form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  label { display: grid; gap: 4px; font-size: .9rem; }
  input, select, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
  button { background: var(--brand); color: #fff; border: 0; cursor: pointer; font-weight: 600; }
  .sub { display: flex; align-items: center; gap: 4px; }
  .sub input { flex: 1; min-width: 0; }
  #msg { grid-column: 1 / -1; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  #cycle { margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>HiTechPOS</h1>
  <div>Phần mềm bán hàng trên nền tảng đám mây cho cửa hàng Việt Nam – tạp hóa, cà phê, nhà hàng, nhà thuốc, thời trang, spa…</div>
  <div class="muted" style="color:#dbe9f7">Thanh toán VietQR · payOS · Pay2S · Dùng thử miễn phí</div>
</header>
<main>
  <h2>Bảng giá</h2>
  <label id="cycle">Chu kỳ thanh toán <select id="months"></select></label>
  <div class="grid" id="plans"></div>

  <h2>Chọn ngành nghề</h2>
  <div class="grid" id="industries"></div>

  <h2>Đăng ký dùng thử</h2>
  <div class="card">
    <form id="signup">
      <label>Tên cửa hàng <input name="businessName" required maxlength="120" placeholder="Cà phê Phở Tuệ"></label>
      <label>Địa chỉ truy cập
        <span class="sub"><input name="subdomain" required pattern="[a-z0-9-]{3,30}" placeholder="photue"><span class="muted" id="base">.hitechpos.vn</span></span>
        <span class="muted" id="avail"></span>
      </label>
      <label>Ngành nghề <select name="industry" id="industrySel"></select></label>
      <label>Họ tên chủ cửa hàng <input name="ownerName" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Số điện thoại <input name="phone" required placeholder="0912 345 678"></label>
      <label>Mã số thuế (không bắt buộc) <input name="taxCode"></label>
      <label>Mật khẩu <input name="password" type="password" minlength="8" required></label>
      <button type="submit">Tạo cửa hàng</button>
      <div id="msg"></div>
    </form>
  </div>
</main>
<script>
const vnd = (n) => new Intl.NumberFormat('vi-VN').format(n) + ' ₫';
const $ = (s) => document.querySelector(s);
let catalogue;

function renderPlans() {
  const months = Number($('#months').value || 1);
  const cycle = catalogue.cycles.find((c) => c.months === months);
  $('#plans').innerHTML = catalogue.plans.map((p) => {
    const total = Math.round(p.monthlyPrice * months * (100 - cycle.discountPercent) / 100);
    const l = p.limits;
    return `<div class="card ${p.highlighted ? 'hl' : ''}"><h3>${p.name}</h3>
      <div class="price">${vnd(Math.round(total / months))}<span class="muted">/tháng</span></div>
      <div class="muted">${months > 1 ? `Thanh toán ${vnd(total)} / ${months} tháng` : 'Thanh toán hàng tháng'}</div>
      <ul class="f"><li>${l.branches} chi nhánh</li><li>${l.users} nhân viên</li><li>${l.devices} thiết bị bán hàng</li>
      <li>${l.products ? new Intl.NumberFormat('vi-VN').format(l.products) + ' mặt hàng' : 'Không giới hạn mặt hàng'}</li></ul></div>`;
  }).join('');
}

async function init() {
  catalogue = await (await fetch('/api/plans')).json();
  $('#months').innerHTML = catalogue.cycles.map((c) => `<option value="${c.months}">${c.months} tháng${c.discountPercent ? ` (giảm ${c.discountPercent}%)` : ''}</option>`).join('');
  $('#months').onchange = renderPlans;
  renderPlans();
  const industries = await (await fetch('/api/industries')).json();
  $('#industrySel').innerHTML = industries.map((i) => `<option value="${i.id}">${i.name}</option>`).join('');
  $('#industries').innerHTML = industries.map((i) => `<div class="card ind" data-id="${i.id}"><strong>${i.name}</strong>
    <div class="muted">${i.description}</div></div>`).join('');
  document.querySelectorAll('.ind').forEach((el) => el.onclick = () => {
    document.querySelectorAll('.ind').forEach((x) => x.classList.remove('sel'));
    el.classList.add('sel');
    $('#industrySel').value = el.dataset.id;
    $('#signup').scrollIntoView({ behavior: 'smooth' });
  });
}

let timer;
$('input[name=subdomain]').addEventListener('input', (e) => {
  clearTimeout(timer);
  const v = e.target.value.trim().toLowerCase();
  timer = setTimeout(async () => {
    if (!v) return ($('#avail').textContent = '');
    const r = await (await fetch('/api/subdomains/' + encodeURIComponent(v))).json();
    $('#avail').className = r.available ? 'ok' : 'err';
    $('#avail').textContent = r.available ? 'Có thể sử dụng' : ({ taken: 'Đã có người dùng', reserved: 'Tên đã được giữ chỗ' }[r.reason] || 'Không hợp lệ');
  }, 300);
});

$('#signup').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  $('#msg').className = ''; $('#msg').textContent = 'Đang khởi tạo cửa hàng…';
  const res = await fetch('/api/signup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const json = await res.json();
  if (!res.ok) { $('#msg').className = 'err'; $('#msg').textContent = json.message || 'Có lỗi xảy ra'; return; }
  try { localStorage.setItem('hitechpos_token', json.token); } catch {}
  const url = json.tenant.urls[0];
  $('#msg').className = 'ok';
  $('#msg').innerHTML = `Đã tạo cửa hàng! Truy cập <a href="${url}">${url}</a> và đăng nhập bằng email vừa đăng ký.`;
});

init();
</script>
</body>
</html>
