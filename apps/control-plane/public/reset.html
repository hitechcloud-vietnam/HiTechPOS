<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt lại mật khẩu – HiTechPOS</title>
<style>
  :root { --brand: #0b6bcb; --ink: #1d2733; --muted: #5d6b7a; --line: #dde5ee; --ok: #12805c; --err: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f8fb; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: min(420px, 100%); }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  form { display: grid; gap: 10px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
  button { background: var(--brand); color: #fff; border: 0; font-weight: 600; cursor: pointer; }
  .msg { min-height: 1.4em; } .ok { color: var(--ok); } .err { color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>Đặt lại mật khẩu</h1>
  <form id="ask">
    <p>Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
    <input name="email" type="email" required placeholder="Email">
    <button>Gửi liên kết</button>
  </form>
  <form id="set" hidden>
    <input name="password" type="password" minlength="8" required placeholder="Mật khẩu mới (ít nhất 8 ký tự)" autocomplete="new-password">
    <input name="confirm" type="password" minlength="8" required placeholder="Nhập lại mật khẩu mới" autocomplete="new-password">
    <button>Đặt mật khẩu mới</button>
  </form>
  <p class="msg" id="msg"></p>
  <p><a href="/account">← Về trang đăng nhập</a></p>
</div>
<script>
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.search).get('token');
const say = (t, ok) => { $('#msg').className = 'msg ' + (ok ? 'ok' : 'err'); $('#msg').textContent = t; };
async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.message || 'Có lỗi xảy ra');
  return json;
}
if (token) { $('#ask').hidden = true; $('#set').hidden = false; history.replaceState(null, '', '/reset'); }
$('#ask').onsubmit = async (e) => {
  e.preventDefault();
  try { say((await post('/api/auth/forgot', { email: e.target.email.value })).message, true); } catch (err) { say(err.message); }
};
$('#set').onsubmit = async (e) => {
  e.preventDefault();
  if (e.target.password.value !== e.target.confirm.value) return say('Mật khẩu nhập lại không khớp.');
  try {
    await post('/api/auth/reset', { token, password: e.target.password.value });
    say('Đã đổi mật khẩu. Đang chuyển về trang đăng nhập…', true);
    setTimeout(() => (location.href = '/account'), 1500);
  } catch (err) { say(err.message); }
};
</script>
</body>
</html>
