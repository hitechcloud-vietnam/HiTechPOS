name: Release

# Publishes a GitHub release whose notes are that version's section of
# CHANGELOG.md, with a source archive. Either push a tag vX.Y.Z on main, or
# run the workflow by hand on main with the version (it creates the tag).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (needs a CHANGELOG.md section)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REF_NAME" != main ]; then echo "Run the release on main" >&2; exit 1; fi
            v="${INPUT_VERSION#v}"
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Bad version: $v" >&2; exit 1; fi
            echo "TAG=v$v" >> "$GITHUB_ENV"
          else
            echo "TAG=$REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { on = index($0, "[" v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version" >&2; exit 1; fi
      - name: Source archive
        run: git archive --format=tar.gz --prefix="hitechpos-${TAG}/" -o "hitechpos-${TAG}.tar.gz" HEAD
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "hitechpos-${TAG}.tar.gz" --title "HiTechPOS ${TAG}" --notes-file notes.md --target "$GITHUB_SHA"
